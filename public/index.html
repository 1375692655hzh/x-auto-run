<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X 运营监控</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <div class="side">
    <h1>X 运营监控</h1>
    <div class="sub">本地只读 · 数据=审计日志</div>
    <div id="accts"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="tabs">
        <button id="tab-overview" class="on" onclick="switchTab('overview')">总览</button>
        <button id="tab-data" onclick="switchTab('data')">数据</button>
        <button id="tab-task" onclick="switchTab('task')">任务</button>
      </div>
      <button class="btn-refresh" onclick="load()">刷新</button>
      <div class="meta" id="meta"></div>
      <div id="conn-warn" style="display:none;background:#fdecea;color:#c0392b;padding:6px 12px;border-radius:6px;margin:6px 0;font-size:13px"></div>
    </div>
    <div id="view-overview"></div>
    <div id="view-data" style="display:none"></div>
    <div id="view-task" style="display:none"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
